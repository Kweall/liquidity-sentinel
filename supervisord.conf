[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/supervisord.pid
loglevel=info

[program:streamlit]
command=streamlit run /app/dashboard/app.py
    --server.port=8501
    --server.address=0.0.0.0
    --server.headless=true
    --server.fileWatcherType=none
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/app/data/logs/streamlit.log
stderr_logfile=/app/data/logs/streamlit.log
stdout_logfile_maxbytes=10MB

[program:scheduler]
command=python /app/scheduler.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/app/data/logs/scheduler.log
stderr_logfile=/app/data/logs/scheduler.log
stdout_logfile_maxbytes=10MB